# verafy_ruling: commit, reveal and the Ruling account on Solana, with no
# validator changes (SOL-002). Same zero-dependency style as the TinySVM
# programs: it reads the loader's input through `abi` and nothing else.
[package]
name = "verafy-ruling"
version = "0.0.3"
edition = "2021"
license = "MIT"

[lib]
name = "verafy_ruling"
crate-type = ["cdylib", "lib"]

[dependencies]
abi = { package = "tinysvm-abi", path = "../../tinysvm/programs/abi" }

[profile.release]
overflow-checks = true
codegen-units = 1
lto = true
panic = "abort"

[workspace]
