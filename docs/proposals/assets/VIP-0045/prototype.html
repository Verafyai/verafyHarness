<!DOCTYPE html>
<html lang="en" data-theme="verafy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verafy Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#05080d;--surface:#0e141b;--surface-2:#0a0f15;--raised:#121a23;--border:#232c36;--border-soft:#1d2630;--text:#ffffff;--text-2:#dfe5eb;--text-3:#b8c2cc;--text-4:#9aa6b2;--accent:#5fe0c8;--accent-2:#2dd4bf;--accent-fill:#3f8f80;--accent-fill-hover:#4aa392;--on-accent:#05080d;--wash:rgba(95,224,200,.10);--accent-border:rgba(95,224,200,.45);--warn:#e0b45f;--danger:#f28b82;--sky:#7cc4fa;--violet:#8b93ff;--mono:ui-monospace,"SFMono-Regular",Menlo,monospace;--sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;overflow:hidden;-webkit-font-smoothing:antialiased;color-scheme:dark}
button{font-family:inherit}
.top{height:64px;display:flex;align-items:center;gap:14px;padding:0 20px;border-bottom:1px solid var(--border);background:var(--bg)}
.brand{display:flex;align-items:center;gap:12px}
.brand .prod{font-size:20px;font-weight:600;color:var(--text-2);padding-left:12px;border-left:1px solid var(--border)}
.pill{font-size:13px;padding:3px 10px;border-radius:999px;border:1px solid var(--border);color:var(--text-3);white-space:nowrap}
.pill.mock{color:var(--warn);border-color:#4a3d22;background:#1c170c}
.top .sp{flex:1}
.lab{font-size:14px;color:var(--text-4);display:flex;align-items:center;gap:6px}
.lab select{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:4px 6px;font:inherit;font-size:14px}
input[type=checkbox]{accent-color:#5fe0c8;width:16px;height:16px}
.btn{min-height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--text);font-size:15px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent-border)}
.btn.pri{background:var(--accent-fill);border-color:var(--accent-fill);color:var(--on-accent)}
.btn.pri:hover{background:var(--accent-fill-hover)}
.btn.sm{min-height:32px;padding:0 12px;font-size:14px}
#app{display:grid;grid-template-columns:268px 1fr 420px;height:calc(100% - 64px)}
#left{background:var(--surface-2);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.segs{display:flex;gap:6px;padding:12px}
.seg{flex:1;font-size:14px;padding:7px 8px;border-radius:999px;border:1px solid var(--border);background:transparent;color:var(--text-4);cursor:pointer}
.seg.on{background:var(--surface);color:var(--text);border-color:var(--accent-border)}
#lfilter{margin:0 12px 8px;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:8px 12px;font:inherit;font-size:15px;outline:none}
#lfilter:focus{border-color:var(--accent)}
#llist{overflow:auto;flex:1;padding:0 12px 16px}
.lcat{margin:16px 2px 6px;font-size:13px;font-weight:600;color:var(--text-4)}
.tplrow{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--border-soft);border-radius:10px;background:var(--surface);margin:6px 0;cursor:pointer}
.tplrow:hover{border-color:var(--accent-border)}
.tplrow .ic{width:30px;height:30px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;font-size:15px;background:var(--wash);color:var(--accent)}
.tplrow b{display:block;font-size:15px;font-weight:600}
.tplrow small{display:block;color:var(--text-4);font-size:13px;line-height:1.35;margin-top:2px}
.pnode{display:flex;align-items:center;gap:9px;height:38px;margin:6px 0;padding-right:10px;border:1px solid var(--border);border-radius:10px;background:var(--surface);font-size:15px;color:var(--text);cursor:grab;user-select:none;overflow:hidden}
.pnode:hover{border-color:var(--accent-border)}
.pnode .pi{width:36px;height:100%;display:flex;align-items:center;justify-content:center;font-size:16px;border-right:1px solid var(--border-soft)}
#work{display:flex;flex-direction:column;min-width:0;min-height:0}
#tabs{display:flex;gap:6px;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--surface-2);overflow-x:auto;align-items:center}
.tab{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;font-size:14px;color:var(--text-4);cursor:pointer;white-space:nowrap;border:1px solid transparent}
.tab:hover{color:var(--text)}
.tab.on{background:var(--surface);color:var(--text);border-color:var(--border)}
.tab.sub{font-style:italic}
.tab .x{color:var(--text-4);font-size:13px;padding:0 2px}
.tab .x:hover{color:var(--danger)}
.tab .act{width:7px;height:7px;border-radius:50%;background:var(--accent);display:none;box-shadow:0 0 8px var(--accent)}
.tab.busy .act{display:inline-block}
#canvasWrap{position:relative;flex:1;overflow:hidden;background:radial-gradient(ellipse at 40% 20%,#0b1219 0%,#05080d 70%)}
svg#canvas{position:absolute;inset:0;width:100%;height:100%;user-select:none}
.nbody{fill:var(--surface);stroke:var(--border);stroke-width:1}
.node:hover .nbody{stroke:#33414f}
.node.sel .nbody{stroke:var(--accent);stroke-width:1.6;filter:drop-shadow(0 0 10px rgba(95,224,200,.3))}
.node.off .nbody{stroke:var(--danger);stroke-dasharray:5 4}
.node text.lbl{font-size:15px;fill:var(--text);font-family:var(--sans);font-weight:500}
.node .port{fill:var(--raised);stroke:#5d6b79;stroke-width:1.2}
.node .port:hover{fill:var(--accent);stroke:var(--accent)}
.node .btn2{cursor:pointer}
.node .btn2 rect{fill:var(--raised);stroke:var(--border)}
.node .btn2:hover rect{stroke:var(--accent)}
.node .stxt{font-size:13px;fill:var(--text-4);font-family:var(--sans)}
.node .badge{font-size:12.5px;fill:var(--text-4);font-family:var(--sans)}
.plabel{font-size:12px;fill:var(--text-4);font-family:var(--sans)}
.wire{fill:none;stroke:#2e3a46;stroke-width:2.2;cursor:pointer}
.wire:hover,.wire.sel{stroke:var(--accent)}
.wire.on{stroke:#3f8f80}
.wirehit{fill:none;stroke:transparent;stroke-width:12;cursor:pointer}
.packet{fill:#bff5ea;filter:drop-shadow(0 0 6px #5fe0c8)}
#zoomctl{position:absolute;right:14px;bottom:14px;display:flex;background:var(--surface);border:1px solid var(--border);border-radius:999px;overflow:hidden}
#zoomctl button{width:40px;height:32px;border:0;background:transparent;color:var(--text-3);cursor:pointer;font-size:15px}
#zoomctl button:hover{color:var(--accent)}
#hint{position:absolute;left:16px;bottom:16px;font-size:13px;color:var(--text-4)}
#right{background:var(--surface-2);border-left:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
#rtabs{display:flex;gap:6px;padding:12px 14px 8px}
#rtabs button{font-size:14px;padding:6px 14px;border-radius:999px;border:1px solid var(--border);background:transparent;color:var(--text-4);cursor:pointer}
#rtabs button.on{background:var(--surface);color:var(--text);border-color:var(--accent-border)}
.rp{flex:1;overflow:auto;display:none;padding:4px 18px 24px}
.rp.on{display:block}
.rp h3{font-size:22px;font-weight:700;margin:8px 0 2px;letter-spacing:-.01em}
.rp .ty{color:var(--text-4);font-size:14px;margin-bottom:12px}
.rp p{color:var(--text-2);font-size:15px;line-height:1.55;margin:0 0 10px}
.sec{border-top:1px solid var(--border-soft);padding:12px 0 4px}
.sec>h4{margin:0 0 8px;font-size:14px;font-weight:600;color:var(--accent)}
.f{margin:0 0 12px}
.f label{display:block;font-size:14px;color:var(--text-3);margin:0 0 5px}
.f .hint{font-size:13px;color:var(--text-4);margin-top:4px}
.f input[type=text],.f input[type=number],.f textarea,.f select{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:8px 10px;font:inherit;font-size:15px;outline:none}
.f textarea{min-height:84px;font-family:var(--mono);font-size:14px;line-height:1.5;resize:vertical}
.f input:focus,.f textarea:focus,.f select:focus{border-color:var(--accent)}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:15px;color:var(--text-2);padding:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:14px;padding:5px 11px;border-radius:999px;border:1px solid var(--border);color:var(--text-3);cursor:pointer;user-select:none}
.chip.on{background:var(--wash);border-color:var(--accent-border);color:var(--accent)}
.warnbox{font-size:14px;color:var(--warn);background:#1c170c;border:1px solid #4a3d22;border-radius:10px;padding:8px 12px;margin:6px 0 12px}
.okbox{font-size:14px;color:var(--accent);background:var(--wash);border:1px solid var(--accent-border);border-radius:10px;padding:8px 12px;margin:6px 0 12px}
.kv{width:100%;border-collapse:collapse;font-size:14px}
.kv td{border-top:1px solid var(--border-soft);padding:6px 4px;vertical-align:top;color:var(--text-2)}
.kv td:first-child{color:var(--text-4);width:130px}
.verdict{border:1px solid var(--accent-border);background:var(--wash);border-radius:14px;padding:14px 16px;margin:6px 0 12px}
.verdict .v{font-size:26px;font-weight:700;color:var(--accent)}
.verdict .m{font-size:14px;color:var(--text-3);margin-top:4px}
.vt{width:100%;border-collapse:collapse;font-size:14px;margin:4px 0 8px}
.vt th{text-align:left;color:var(--text-4);font-weight:500;border-bottom:1px solid var(--border);padding:6px 4px}
.vt td{border-bottom:1px solid var(--border-soft);padding:6px 4px;vertical-align:top;color:var(--text-2)}
.yes{color:var(--accent)}.no{color:var(--danger)}.mid{color:var(--warn)}
.tree{font-family:var(--mono);font-size:13.5px;line-height:1.6;color:var(--text-2)}
.tree .k{color:#9fd8ff}.tree .s{color:#d9e7a8}.tree .n{color:var(--accent)}.tree .b{color:var(--violet)}
.tree .tg{cursor:pointer;color:var(--text-4)}
.tree .tg::before{content:"▸ "}
.tree .tg.open::before{content:"▾ "}
.tree .ch{padding-left:14px;display:none}
.tree .ch.open{display:block}
.dt li{margin:3px 0}
#dbgbar{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--text-4);padding:4px 0 10px;border-bottom:1px solid var(--border)}
#dbgbar .sp{flex:1}
.dmsg{border-bottom:1px solid var(--border-soft);padding:10px 0}
.dmsg .dh{color:var(--text-4);font-size:13px;cursor:pointer}
.dmsg .dh b{color:var(--text-2);font-weight:500}
.dmsg .dt2{color:var(--accent);font-size:13.5px;font-family:var(--mono);margin:3px 0}
#gal{position:fixed;left:0;right:0;top:64px;bottom:0;background:rgba(5,8,13,.94);backdrop-filter:blur(6px);display:none;z-index:20;overflow:auto}
#gal.on{display:block}
.gw{max-width:1320px;margin:0 auto;padding:36px 32px 64px;display:grid;grid-template-columns:200px 1fr;gap:32px}
.gw h1{grid-column:1/-1;margin:0;font-size:44px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.gw h1 span{color:var(--accent)}
.gw .lede{grid-column:1/-1;color:var(--text-3);font-size:18px;line-height:1.55;max-width:70ch;margin:-14px 0 0}
.gf button{display:block;width:100%;text-align:left;font-size:15px;padding:8px 12px;border-radius:999px;border:1px solid transparent;background:transparent;color:var(--text-3);cursor:pointer;margin-bottom:3px}
.gf button.on{background:var(--surface);border-color:var(--accent-border);color:var(--text)}
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;align-content:start}
.gc{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px}
.gc:hover{border-color:var(--accent-border)}
.gc .h{display:flex;gap:12px;align-items:center}
.gc .ic{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;background:var(--wash);color:var(--accent);flex:none}
.gc h3{margin:0;font-size:19px;font-weight:600}
.gc .cat{font-size:13px;color:var(--text-4)}
.gc p{margin:0;color:var(--text-3);font-size:15px;line-height:1.5}
.gc .chs{display:flex;flex-wrap:wrap;gap:6px}
.gc .ft{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:10px;border-top:1px solid var(--border-soft)}
#toast{position:fixed;top:76px;left:50%;transform:translateX(-50%);background:var(--surface);color:var(--text);border:1px solid var(--accent-border);font-size:15px;padding:8px 16px;border-radius:999px;display:none;z-index:40}
</style>
</head>
<body>

  <div class="brand"><svg role="img" aria-label="Verafy" xmlns="http://www.w3.org/2000/svg" height="22" viewBox="0 0 724.639 117.404">

<div id="app">
  <aside id="left"><div class="segs"><button class="seg on" data-v="tpl">Templates</button><button class="seg" data-v="nodes">Nodes</button></div><input id="lfilter" placeholder="Filter"><div id="llist"></div></aside>
  <section id="work">
    <div id="tabs"></div>
    <div id="canvasWrap">
      <svg id="canvas"><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#16202a"/></pattern></defs>
        <g id="vp"><rect x="-5000" y="-5000" width="12000" height="12000" fill="url(#grid)"/><g id="wires"></g><g id="packets"></g><g id="nodes"></g><path id="drawwire" class="wire" style="display:none;pointer-events:none"/></g></svg>
      <div id="hint">Drag nodes. Drag from a port to wire. Click a node to set its parameters. Delete removes.</div>
      <div id="zoomctl"><button id="zout">−</button><button id="zfit">fit</button><button id="zin">+</button></div>
    </div>
  </section>
  <aside id="right">
    <div id="rtabs"><button data-p="insp" class="on">Inspector</button><button data-p="ruling">Ruling</button><button data-p="debug">Debug</button></div>

    <div class="rp" id="ruling"></div>
    <div class="rp" id="debug"><div id="dbgbar"><span id="dcount">0 messages</span><span class="sp"></span><button class="btn sm" id="dclear">Clear</button></div><div id="dlist"></div></div>
  </aside>

<script>
/* ================= node types ================= */
const C={sky:"#7cc4fa",teal:"#5fe0c8",teal2:"#2dd4bf",violet:"#8b93ff",warn:"#e0b45f",danger:"#f28b82",grey:"#9aa6b2"};
const TYPES={
 trigger:{cat:"Triggers",col:C.sky,icon:"▶",ins:0,outs:1,btn:"left",name:"Trigger"},
 policy:{cat:"Contract",col:C.teal,icon:"§",ins:1,outs:1,name:"Policy"},

let uid=0;
function build(chains,extra={}){
  const nodes=[],wires=[],PER=4;
  const P=(c,r)=>[60+c*260,70+r*160];
  const mkN=(key,type,name,x,y,p)=>{const n={id:key,type,name,x,y,p:Object.assign(JSON.parse(JSON.stringify(DEF[type]||{})),p||{})};nodes.push(n);return n};
  chains.forEach(ch=>{
    let prev=null,c=0,r=(ch.r0||0);
    ch.seq.forEach((s,i)=>{const [key,type,name,p]=s;if(type==="decide"&&c>1){c=0;r++}const [x,y]=P(c,r);mkN(key,type,name,x,y,p);if(prev)wires.push([prev,0,key]);prev=key;c++;if(c>=PER){c=0;r++}});
    if(ch.branches){const last=nodes.find(n=>n.id===ch.seq[ch.seq.length-1][0]);const m=ch.branches.length;
      ch.branches.forEach((b,k)=>{const [key,type,name,p]=b;mkN(key,type,name,last.x+380,last.y+k*72,p);wires.push([last.id,k,key])})}
  });
  (extra.nodes||[]).forEach(([key,type,name,c,r,p])=>{let x,y;if(typeof c==="string"){const a=nodes.find(n=>n.id===c);x=a.x+20;y=a.y+92}else[x,y]=P(c,r);mkN(key,type,name,x,y,p)});
  (extra.wires||[]).forEach(w=>wires.push(w));
  return {nodes,wires};
}

const JURYFLOW=()=>{const n=[],w=[];const add=(id,type,name,x,y,p)=>n.push({id,type,name,x,y,p:Object.assign(JSON.parse(JSON.stringify(DEF[type]||{})),p||{})});
 add("in","sfin","in: jury request",40,60);add("g","guard","Prompt Guard",300,60);add("cmp","compiler","Compiled rules",560,60);add("pre","precedent","Precedent check",820,60);add("fan","fan","Fan out to jurors",40,330);
 ["Frontier, lab A","Frontier, lab B","Strong open-weight, lab C","Strong open-weight, lab D","Frontier, lab E"].forEach((l,i)=>add("j"+i,"juror","Juror "+(i+1)+": "+l,330,190+i*78,{level:l.split(",")[0],lab:l.split(", ")[1]}));
 add("col","collect","Collect votes",720,330);add("q","decide","Quorum met?",960,330,{});add("tree","ruling","Decision tree and sign",1260,260,RF);add("esc","human","Another round",1260,420,{panel:"Same jury, round 2",when:"Quorum is not met."});add("out","sfout","out: signed ruling",1260,160);
 w.push(["in",0,"g"],["g",0,"cmp"],["cmp",0,"pre"],["pre",0,"fan"]);for(let i=0;i<5;i++){w.push(["fan",i,"j"+i],["j"+i,0,"col"])}w.push(["col",0,"q"],["q",0,"tree"],["q",1,"esc"],["esc",0,"fan"],["tree",0,"out"]);

<script>
/* ================= state ================= */
const LS="verafy-studio-v1";
let S;try{S=JSON.parse(localStorage.getItem(LS)||"null")}catch(e){S=null}
function freshFlow(t){const g=t.make();return{id:"f"+(++uid)+Date.now().toString(36),tpl:t.id,name:t.name,nodes:g.nodes,wires:g.wires,simPick:t.simPick||0}}
function defaultState(){return{flows:[freshFlow(TPL[0])],cur:null}}
if(!S||!S.flows){S=defaultState()}
const JF={id:"jury",name:"Jury call (subflow)",sub:true,...JURYFLOW()};
if(!S.cur)S.cur=S.flows[0].id;
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
const curFlow=()=>S.cur==="jury"?JF:S.flows.find(f=>f.id===S.cur)||S.flows[0];
const byId=()=>Object.fromEntries(curFlow().nodes.map(n=>[n.id,n]));
const VIEW={},fitted={};let sel=null,selWire=null;const ST={};const onW=new Set();let busyFlow=null;
/* ================= geometry ================= */
const ctx=document.createElement("canvas").getContext("2d");ctx.font='500 15px Inter,system-ui,sans-serif';
function outsList(n){if(n.outsOverride)return n.outsOverride;if(n.type==="decide"){const f=curFlow();const j=findUpstreamJury(f,n.id);if(j){const o=(j.p.outcomes||"").split("\n").map(s=>s.trim()).filter(Boolean);if(o.length)return o}return["Yes","No"]}return null}
function outsOf(n){const l=outsList(n);if(l)return l.length;return TYPES[n.type].outs}
function size(n){const w=Math.max(170,Math.ceil((ctx.measureText(n.name).width+70)/10)*10);const h=Math.max(44,outsOf(n)*18+10);return[w,h]}
function outPort(n,i){const[w,h]=size(n),k=outsOf(n);return[n.x+w,n.y+h/2+(i-(k-1)/2)*18]}
function inPort(n){const[,h]=size(n);return[n.x,n.y+h/2]}
function wpath(x1,y1,x2,y2){if(x2<x1-30){const up=y2<y1-20;const ym=up?Math.min(y1,y2)-46:y1+52;const a=x1+26,b=x2-26,r=10,sy=ym>y1?1:-1,ty=y2>ym?1:-1;return`M${x1},${y1} H${a-r} Q${a},${y1} ${a},${y1+sy*r} V${ym-sy*r} Q${a},${ym} ${a-r},${ym} H${b+r} Q${b},${ym} ${b},${ym+ty*r} V${y2-ty*r} Q${b},${y2} ${b+r},${y2} H${x2}`}let dx=Math.max(50,Math.abs(x2-x1)*.5);return`M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}`}
const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
function findUpstreamJury(f,id){const seen=new Set();let q=[id];while(q.length){const x=q.shift();if(seen.has(x))continue;seen.add(x);const ins=f.wires.filter(w=>w[2]===x).map(w=>w[0]);for(const p of ins){const pn=f.nodes.find(n=>n.id===p);if(pn&&pn.type==="jury")return pn;q.push(p)}}return null}
/* ================= render ================= */
const svg=document.getElementById("canvas"),vp=document.getElementById("vp");
function applyView(){const v=VIEW[S.cur]||{x:30,y:30,k:1};vp.setAttribute("transform",`translate(${v.x},${v.y}) scale(${v.k})`)}
function fit(){const f=curFlow();const ns=f.nodes;if(!ns.length){VIEW[S.cur]={x:40,y:40,k:1};return}let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;ns.forEach(n=>{const[w,h]=size(n);x0=Math.min(x0,n.x-40);y0=Math.min(y0,n.y-30);x1=Math.max(x1,n.x+w+40);y1=Math.max(y1,n.y+h+30)});const r=svg.getBoundingClientRect();if(!r.width)return;const k=Math.max(.42,Math.min(1,(r.width-40)/(x1-x0),(r.height-50)/(y1-y0)));VIEW[S.cur]={k,x:20-x0*k+Math.max(0,(r.width-40-(x1-x0)*k)/2),y:20-y0*k}}
function renderTabs(){const T=document.getElementById("tabs");T.innerHTML=S.flows.map(f=>`<div class="tab ${f.id===S.cur?"on":""} ${busyFlow===f.id?"busy":""}" data-f="${f.id}"><span class="act"></span>${esc(f.name)}<span class="x" data-x="${f.id}">✕</span></div>`).join("")+`<div class="tab sub ${S.cur==="jury"?"on":""} ${busyFlow==="jury"?"busy":""}" data-f="jury"><span class="act"></span>Jury call (subflow)</div><button class="btn sm" id="newflow" style="margin-left:4px">+ New</button>`;
 T.querySelectorAll(".tab").forEach(t=>t.onclick=e=>{if(e.target.dataset.x){closeFlow(e.target.dataset.x);return}showFlow(t.dataset.f)});document.getElementById("newflow").onclick=openGallery}
function renderWires(){const f=curFlow(),B=byId();document.getElementById("wires").innerHTML=f.wires.map((w,i)=>{const a=B[w[0]],b=B[w[2]];if(!a||!b)return"";if(w[1]>=outsOf(a))return"";const[x1,y1]=outPort(a,w[1]),[x2,y2]=inPort(b);const d=wpath(x1,y1,x2,y2);return`<path class="wirehit" data-w="${i}" d="${d}"/><path id="w${i}" class="wire ${selWire===i?"sel":""} ${onW.has(S.cur+":"+i)?"on":""}" data-w="${i}" d="${d}"/>`}).join("")}
const SCOL={ok:"#5fe0c8",run:"#7cc4fa",warn:"#e0b45f",bad:"#f28b82",idle:"#5d6b79"};
function renderNodes(){const f=curFlow();document.getElementById("nodes").innerHTML=f.nodes.map(n=>{const t=TYPES[n.type],[w,h]=size(n),k=outsOf(n),st=ST[S.cur+":"+n.id]||{};const off=(n.type==="guard"&&n.p.enabled===false)||(n.type==="compiler"&&n.p.enabled===false);
 let s=`<g class="node ${sel===n.id?"sel":""} ${off?"off":""}" data-id="${n.id}" transform="translate(${n.x},${n.y})">`;
 if(t.btn==="left")s+=`<g class="btn2" data-btn="inject"><rect x="-30" y="7" width="24" height="${h-14}" rx="7"/><path d="M-22 ${h/2-5} L-13 ${h/2} L-22 ${h/2+5}Z" fill="#5fe0c8"/></g>`;
 if(t.btn==="right")s+=`<g class="btn2" data-btn="toggle"><rect x="${w+6}" y="7" width="24" height="${h-14}" rx="7"/><circle cx="${w+18}" cy="${h/2}" r="4.5" fill="${n.p.active!==false?"#5fe0c8":"none"}" stroke="#5fe0c8"/></g>`;
 s+=`<rect class="nbody" width="${w}" height="${h}" rx="10"/><path d="M10 0 H40 V${h} H10 A10 10 0 0 1 0 ${h-10} V10 A10 10 0 0 1 10 0Z" fill="${t.col}" fill-opacity=".13"/><line x1="40" y1="1" x2="40" y2="${h-1}" stroke="#1d2630"/>`;
 s+=`<text x="20" y="${h/2+6}" text-anchor="middle" font-size="17" fill="${t.col}">${t.icon}</text><text class="lbl" x="${40+(w-40)/2}" y="${h/2+5}" text-anchor="middle">${esc(n.name)}</text>`;
 const badge=nodeBadge(n);if(badge)s+=`<text class="badge" x="${w}" y="-8" text-anchor="end">${esc(badge)}</text>`;
 if(t.ins)s+=`<circle class="port in" cx="0" cy="${h/2}" r="5.5"/>`;
 const ol=outsList(n);for(let i=0;i<k;i++){const y=h/2+(i-(k-1)/2)*18;s+=`<circle class="port out" data-port="${i}" cx="${w}" cy="${y}" r="5.5"/>`;if(ol&&k>1)s+=`<text class="plabel" x="${w+10}" y="${y+4}">${esc(ol[i])}</text>`}
 if(st.text){const c=SCOL[st.c]||st.c;s+=`<g transform="translate(6,${h+18})">${st.ring?`<circle cx="4" cy="-4" r="4" fill="none" stroke="${c}" stroke-width="1.8"/>`:`<circle cx="4" cy="-4" r="4.5" fill="${c}"/>`}<text class="stxt" x="15" y="0">${esc(st.text)}</text></g>`}
 return s+"</g>"}).join("")}
function nodeBadge(n){const p=n.p||{};switch(n.type){case"jury":return`${p.quorum} of ${p.jurors} · ${(p.assurance||"").split(":")[0]}`;case"agents":return`${p.count} agents${p.subagents?" + sub-agents":""}`;case"guard":return p.enabled===false?"OFF":"";case"budget":return`${p.max_credits} credits max`;case"challenge":return`${p.hours}h window`;case"scorecard":return`pass ≥ ${p.pass}`;case"bond":return p.perf?`bond ${p.perf}`:"";default:return""}}
function render(){renderTabs();renderWires();renderNodes();applyView()}
function showFlow(id){S.cur=id;save();if(!fitted[id]){fit();fitted[id]=1}sel=null;selWire=null;document.getElementById("packets").innerHTML="";render();inspectFlow()}
function closeFlow(id){if(S.flows.length<=1){toast("Keep at least one flow open");return}S.flows=S.flows.filter(f=>f.id!==id);if(S.cur===id)S.cur=S.flows[0].id;save();showFlow(S.cur)}
/* ================= left panel ================= */
let lview="tpl";
function left(){const q=document.getElementById("lfilter").value.toLowerCase();const L=document.getElementById("llist");document.querySelectorAll(".seg").forEach(b=>b.classList.toggle("on",b.dataset.v===lview));
 if(lview==="tpl"){const cats=[...new Set(TPL.map(t=>t.cat))];L.innerHTML=cats.map(c=>{const ts=TPL.filter(t=>t.cat===c&&(!q||t.name.toLowerCase().includes(q)));if(!ts.length)return"";return`<div class="lcat">${c}</div>`+ts.map(t=>`<div class="tplrow" data-t="${t.id}"><span class="ic">${t.icon}</span><div><b>${esc(t.name)}</b><small>${esc(t.desc.split(". ")[0])}.</small></div></div>`).join("")}).join("")+`<button class="btn" style="width:100%;margin-top:14px" id="galopen">Browse all templates</button>`;
  L.querySelectorAll(".tplrow").forEach(r=>r.onclick=()=>openTemplate(r.dataset.t));document.getElementById("galopen").onclick=openGallery}
 else{L.innerHTML=CATS.map(c=>{const items=Object.entries(TYPES).filter(([k,t])=>t.cat===c&&(!q||t.name.toLowerCase().includes(q)));if(!items.length)return"";return`<div class="lcat">${c}</div>`+items.map(([k,t])=>`<div class="pnode" data-type="${k}"><span class="pi" style="color:${t.col};background:${t.col}1f">${t.icon}</span>${t.name}</div>`).join("")}).join("");
  L.querySelectorAll(".pnode").forEach(p=>p.onpointerdown=e=>{e.preventDefault();pdrag=p.dataset.type;document.body.style.cursor="copy"})}}
document.querySelectorAll(".seg").forEach(b=>b.onclick=()=>{lview=b.dataset.v;left()});document.getElementById("lfilter").oninput=left;
function openTemplate(id){const t=TPL.find(x=>x.id===id);const ex=S.flows.find(f=>f.tpl===id);if(ex){showFlow(ex.id);return}const f=freshFlow(t);S.flows.push(f);save();closeGallery();showFlow(f.id);toast(`${t.name} opened with its preset parameters`)}
let pdrag=null;
window.addEventListener("pointerup",e=>{if(!pdrag)return;document.body.style.cursor="";const r=svg.getBoundingClientRect();if(S.cur!=="jury"&&e.clientX>r.left&&e.clientX<r.right&&e.clientY>r.top&&e.clientY<r.bottom){const[x,y]=toW(e.clientX,e.clientY);const id="n"+Date.now().toString(36);curFlow().nodes.push({id,type:pdrag,name:TYPES[pdrag].name,x:Math.round(x/10)*10,y:Math.round(y/10)*10,p:JSON.parse(JSON.stringify(DEF[pdrag]||{}))});save();sel=id;render();inspect(id)}pdrag=null});
/* ================= canvas interaction ================= */
function toW(cx,cy){const r=svg.getBoundingClientRect(),v=VIEW[S.cur]||{x:0,y:0,k:1};return[(cx-r.left-v.x)/v.k,(cy-r.top-v.y)/v.k]}
let drag=null;
svg.addEventListener("pointerdown",e=>{const B=byId();const port=e.target.closest(".port.out"),g=e.target.closest(".node"),btn=e.target.closest(".btn2"),wire=e.target.closest("[data-w]");
 if(btn&&g){const n=B[g.dataset.id];if(btn.dataset.btn==="inject")run(n.id);else{n.p.active=n.p.active===false;save();renderNodes()}return}
 if(port&&g){if(S.cur==="jury")return;drag={wire:true,from:g.dataset.id,port:+port.dataset.port};svg.setPointerCapture(e.pointerId);return}
 if(g){const n=B[g.dataset.id];const[x,y]=toW(e.clientX,e.clientY);drag={node:n,dx:x-n.x,dy:y-n.y,moved:false};sel=n.id;selWire=null;renderNodes();renderWires();inspect(n.id);svg.setPointerCapture(e.pointerId);return}
 if(wire){selWire=+wire.dataset.w;sel=null;renderWires();renderNodes();return}
 sel=null;selWire=null;renderNodes();renderWires();inspectFlow();const v=VIEW[S.cur];drag={pan:true,sx:e.clientX,sy:e.clientY,vx:v.x,vy:v.y};svg.setPointerCapture(e.pointerId)});
svg.addEventListener("pointermove",e=>{if(!drag)return;const v=VIEW[S.cur];
 if(drag.pan){v.x=drag.vx+e.clientX-drag.sx;v.y=drag.vy+e.clientY-drag.sy;applyView();return}
 if(drag.node){const[x,y]=toW(e.clientX,e.clientY);drag.node.x=Math.round((x-drag.dx)/10)*10;drag.node.y=Math.round((y-drag.dy)/10)*10;drag.moved=true;renderWires();renderNodes();return}
 if(drag.wire){const[x1,y1]=outPort(byId()[drag.from],drag.port),[x2,y2]=toW(e.clientX,e.clientY);const p=document.getElementById("drawwire");p.style.display="";p.setAttribute("d",wpath(x1,y1,x2,y2))}});
svg.addEventListener("pointerup",e=>{if(drag&&drag.wire){document.getElementById("drawwire").style.display="none";const el=document.elementFromPoint(e.clientX,e.clientY),g=el&&el.closest(".node");if(g&&g.dataset.id!==drag.from&&TYPES[byId()[g.dataset.id].type].ins){curFlow().wires.push([drag.from,drag.port,g.dataset.id]);save();renderWires()}}
 if(drag&&drag.node&&drag.moved)save();drag=null});

  case"challenge":status(n.id,`${p.hours}h window, no challenge`,"ok");break;
  case"decide":{const ol=outsList(n);status(n.id,ol[Math.min(f.simPick||0,ol.length-1)],"ok");break}
  case"human":status(n.id,S.cur==="jury"?"not needed":"not called","idle");break;
  case"settle":status(n.id,`${p.action}: tx ${hash(n.id+f.name).slice(0,6)}… (mock)`,"ok");if(lastRuling)lastRuling.settlement=`${p.action} on ${p.network}`;break;
  case"certify":status(n.id,`${p.wording}, written to ${p.network}`,"ok");break;
  case"debug":status(n.id,"message shown","ok");dbg(n,n.name,msg.ruling||msg);break;
  case"sfout":status(n.id,"signed ruling out","ok");break;
  default:status(n.id,"done","ok")}};
 triggers.forEach(id=>visit(id,null));
 at(()=>{busyFlow=null;renderTabs();if(lastRuling){showRuling(lastRuling);rtab("ruling")}toast(lastRuling?`Ruling: ${lastRuling.ruling}`:"Run finished")});}
document.getElementById("run").onclick=()=>run();
/* ================= gallery ================= */
let gcat="All";
function openGallery(){document.getElementById("gal").classList.add("on");renderGallery()}
function closeGallery(){document.getElementById("gal").classList.remove("on")}
function renderGallery(){const cats=["All",...new Set(TPL.map(t=>t.cat))];const list=TPL.filter(t=>gcat==="All"||t.cat===gcat);
 const chip=t=>{const g=t.make();const j=g.nodes.find(n=>n.type==="jury"),ag=g.nodes.find(n=>n.type==="agents");return[j?`${j.p.quorum} of ${j.p.jurors} jurors`:"",j?j.p.assurance.split(":")[0]:"",ag?`${ag.p.count} agents`:"",g.nodes.some(n=>n.type==="bond")?"Bonded":"",g.nodes.some(n=>n.type==="challenge")?"Challengeable":""].filter(Boolean)};
 document.getElementById("gal").innerHTML=`<div class="gw"><div style="grid-column:1/-1;display:flex;justify-content:space-between;align-items:flex-start"><h1>Judgment <span>templates</span></h1><button class="btn" id="gclose">Close</button></div><p class="lede">Every template is a complete inference program: the policy, the evidence, the jury call, the ruling format and what happens on chain. Open one with its preset parameters, then change anything.</p>
 <div class="gf">${cats.map(c=>`<button data-c="${c}" class="${gcat===c?"on":""}">${c}</button>`).join("")}</div>
 <div class="gg">${list.map(t=>`<div class="gc"><div class="h"><span class="ic">${t.icon}</span><div><h3>${esc(t.name)}</h3><div class="cat">${esc(t.cat)}</div></div></div><p>${esc(t.desc)}</p><div class="chs">${chip(t).map(c=>`<span class="pill">${esc(c)}</span>`).join("")}<span class="pill">Prompt Guard on</span></div><div class="ft"><span style="font-size:14px;color:var(--text-4)">Preset parameters</span><button class="btn pri sm" data-open="${t.id}">Open</button></div></div>`).join("")}</div></div>`;
 const G=document.getElementById("gal");G.querySelector("#gclose").onclick=closeGallery;G.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{gcat=b.dataset.c;renderGallery()});G.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openTemplate(b.dataset.open))}
document.getElementById("galbtn").onclick=openGallery;
/* ================= misc ================= */
document.getElementById("copy").onclick=async()=>{const f=curFlow();const out={verafy_studio:1,name:f.name,template:f.tpl||null,nodes:f.nodes.map(n=>({id:n.id,type:n.type,name:n.name,params:n.p})),wires:f.wires};try{await navigator.clipboard.writeText(JSON.stringify(out,null,2));toast("Flow JSON copied")}catch(e){toast("Copy was blocked by the browser")}};
document.getElementById("resetd").onclick=()=>{S=defaultState();S.cur=S.flows[0].id;save();Object.keys(fitted).forEach(k=>delete fitted[k]);showRuling(null);left();showFlow(S.cur);toast("Studio reset")};
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.style.display="block";clearTimeout(t._h);t._h=setTimeout(()=>t.style.display="none",2200)}
left();showRuling(null);showFlow(S.cur);
try{document.fonts.ready.then(()=>{ctx.font='500 15px Inter,system-ui,sans-serif';Object.keys(fitted).forEach(k=>delete fitted[k]);showFlow(S.cur)})}catch(e){}
</script>
