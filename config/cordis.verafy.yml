# Verafy juror profile overlay for DeepSeek Harness 0.2.2-rc.1 (pinned commit).
#
# Mount on top of the headless profile, from upstream/deepseek-harness:
#   pnpm dsh --profile headless --patch ../../config/cordis.verafy.yml \
#     "Rule on the contract at /abs/path/examples/market-resolution.json"
#
# scripts/dsh-juror.mjs links the plugin into the profile, sets the environment
# below, and runs exactly that. See docs/dsh-juror.md.
#
# Swapping the AI: there is one dsh-llm-pi-ai route per open-weight model family, each serving exactly
# one model, so a harness that picks a route has committed to that model. One
# file serves every harness; the process picks its route through:
#
#   VERAFY_ROUTE         route name below, such as openrouter-mistral or scripted-mistral
#   VERAFY_MODEL         the one model id on that route
#   VERAFY_HARNESS_ID    harness id, such as h-mistral-1
#   VERAFY_HARNESS_FAMILY   the model family the route serves
#   VERAFY_JUROR_OUT     where the key, commitment and private reveal are written
#   VERAFY_SCRIPTED_URL  base URL of scripts/scripted-llm.mjs (scripted routes only)
#
# Keys are credential references, never secrets. The openrouter-* routes read
# VERAFY_API_KEY, the same variable the CLI uses for --live (scripts/dsh-juror.mjs
# fills it from SWARM_API_KEY when only the old name is set). The scripted-* routes
# read VERAFY_SCRIPTED_KEY, which pi-ai requires to be set but which the scripted
# server ignores.

- id: llm-pi-ai
  config:
    providers:
      openrouter-mistral:
        apiKeyEnv: VERAFY_API_KEY
        api: openai-completions
        baseURL: https://openrouter.ai/api/v1
        models: [{ id: mistralai/mistral-small-3.2-24b-instruct }]
      openrouter-gpt-oss:
        apiKeyEnv: VERAFY_API_KEY
        api: openai-completions
        baseURL: https://openrouter.ai/api/v1
        models: [{ id: openai/gpt-oss-120b }]
      openrouter-gemma:
        apiKeyEnv: VERAFY_API_KEY
        api: openai-completions
        baseURL: https://openrouter.ai/api/v1
        models: [{ id: google/gemma-3-27b-it }]
      openrouter-llama:
        apiKeyEnv: VERAFY_API_KEY
        api: openai-completions
        baseURL: https://openrouter.ai/api/v1
        models: [{ id: meta-llama/llama-4-maverick }]
      openrouter-qwen:
        apiKeyEnv: VERAFY_API_KEY
        api: openai-completions
        baseURL: https://openrouter.ai/api/v1
        models: [{ id: qwen/qwen3-235b-a22b-2507 }]
      openrouter-deepseek:
        apiKeyEnv: VERAFY_API_KEY
        api: openai-completions
        baseURL: https://openrouter.ai/api/v1
        models: [{ id: deepseek/deepseek-v4-flash }]
      # Keyless test doubles: scripts/scripted-llm.mjs answers from
      # examples/mock-answers.json by model family, over the same protocol.
      scripted-mistral:
        apiKeyEnv: VERAFY_SCRIPTED_KEY
        api: openai-completions
        baseURL: !!js process.env.VERAFY_SCRIPTED_URL ?? 'http://127.0.0.1:8790/v1'
        models: [{ id: scripted-mistral }]
      scripted-gpt-oss:
        apiKeyEnv: VERAFY_SCRIPTED_KEY
        api: openai-completions
        baseURL: !!js process.env.VERAFY_SCRIPTED_URL ?? 'http://127.0.0.1:8790/v1'
        models: [{ id: scripted-gpt-oss }]
      scripted-gemma:
        apiKeyEnv: VERAFY_SCRIPTED_KEY
        api: openai-completions
        baseURL: !!js process.env.VERAFY_SCRIPTED_URL ?? 'http://127.0.0.1:8790/v1'
        models: [{ id: scripted-gemma }]
      scripted-llama:
        apiKeyEnv: VERAFY_SCRIPTED_KEY
        api: openai-completions
        baseURL: !!js process.env.VERAFY_SCRIPTED_URL ?? 'http://127.0.0.1:8790/v1'
        models: [{ id: scripted-llama }]
      scripted-qwen:
        apiKeyEnv: VERAFY_SCRIPTED_KEY
        api: openai-completions
        baseURL: !!js process.env.VERAFY_SCRIPTED_URL ?? 'http://127.0.0.1:8790/v1'
        models: [{ id: scripted-qwen }]
      scripted-deepseek:
        apiKeyEnv: VERAFY_SCRIPTED_KEY
        api: openai-completions
        baseURL: !!js process.env.VERAFY_SCRIPTED_URL ?? 'http://127.0.0.1:8790/v1'
        models: [{ id: scripted-deepseek }]

- id: agent-default-model
  config:
    provider: !!js process.env.VERAFY_ROUTE
    model: !!js process.env.VERAFY_MODEL

# The juror sees the contract and nothing else: no coding persona, no
# workspace instruction files, no skills, no runtime context snapshot. The
# verafy:juror section and the contract the tool returns are the brief.
- id: system-prompt
  config:
    personaPrefix: You are a Verafy Harness juror model powered by {{model}}.
    includeRuntimeContext: false

- id: agent-instructions
  disabled: true

- id: tool-skill
  disabled: true

- id: skill-filesystem
  disabled: true

- id: skill
  disabled: true

# A juror's session needs no title model call.
- id: session-title-llm
  disabled: true

# The plugin row name must be a literal module name; scripts/dsh-juror.mjs links
# packages/dsh-verafy-juror into the profile's node_modules so it resolves.
- insert:
    - id: verafy-juror
      name: '@verafyharness/dsh-verafy-juror'
      config:
        lockTools: true
        sectionOrder: 50
        outDir: !!js process.env.VERAFY_JUROR_OUT
        harness:
          id: !!js process.env.VERAFY_HARNESS_ID
          family: !!js process.env.VERAFY_HARNESS_FAMILY
          model: !!js process.env.VERAFY_MODEL
          bond: 500
